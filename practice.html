<style>
:root{
  --cyan:#01B6D1; --cyan-dk:#0193A9; --crimson:#BD1C56; --green:#6DB344; --gold:#FFB81C;
  --ink:#1F2933; --slate:#5A6672; --mute:#8A949E; --line:#E3E7EA; --wash:#F5F7F8; --paper:#fff;
  --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink); background:var(--wash);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 72px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--cyan);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
header{background:var(--paper);border-bottom:1px solid var(--line)}
.hd{max-width:760px;margin:0 auto;padding:20px 18px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{margin:0;font-size:1.32rem;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.sub{margin:3px 0 0;color:var(--slate);font-size:.92rem}
.ghost{background:none;border:1px solid var(--line);color:var(--slate);padding:7px 13px;border-radius:var(--r);font-weight:600;font-size:.87rem;white-space:nowrap}
.ghost:hover{border-color:var(--cyan);color:var(--cyan-dk)}
input{font-family:inherit;font-size:.94rem;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
input:hover{border-color:#c9d1d6}
h2{font-size:.95rem;font-weight:700;margin:34px 0 12px;letter-spacing:-.005em}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px}
label{display:block;font-size:.83rem;font-weight:600;color:var(--slate);margin-bottom:4px}
.f input{width:100%}
.btn{background:var(--cyan);border:1px solid var(--cyan);color:#fff;font-weight:700;
  padding:9px 18px;border-radius:var(--r);font-size:.94rem}
.btn:hover{background:var(--cyan-dk);border-color:var(--cyan-dk)}
.btn.q{background:none;color:var(--slate);border-color:var(--line);font-weight:600}
.btn.q:hover{background:var(--wash);color:var(--ink)}
a.btn{text-decoration:none;display:inline-block}
.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.veil{position:fixed;inset:0;background:rgba(31,41,51,.45);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:50}
.modal{background:var(--paper);border-radius:14px;padding:22px;width:100%;max-width:460px;
  max-height:88vh;overflow:auto;box-shadow:0 12px 32px rgba(31,41,51,.24)}
.modal h3{margin:0 0 4px;font-size:1.1rem}
.modal .when{color:var(--slate);font-size:.9rem;margin:0 0 18px}
.note{background:#FFFBEF;border:1px solid #F5E3B8;border-radius:10px;padding:12px 14px;
  font-size:.89rem;color:#6B5518;line-height:1.5;margin-top:26px}
.load{padding:60px 0;text-align:center;color:var(--mute)}

/* site navigation (shared by all pages) */
.site{background:var(--ink);color:#fff}
.site-in{max-width:760px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;justify-content:space-between;gap:6px 18px;flex-wrap:wrap}
.brand{color:#fff;text-decoration:none;font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;gap:9px;padding:4px 0}
.brand:hover{color:#fff}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--cyan);flex:none}
.brand span{font-weight:400;opacity:.65}
.links{display:flex;gap:2px;flex-wrap:wrap;margin:0 -10px}
.links a{color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem;font-weight:600;padding:7px 10px;border-radius:7px}
.links a:hover{color:#fff;background:rgba(255,255,255,.09)}
.links a[aria-current="page"]{color:#fff;background:rgba(1,182,209,.22)}
@media print{.site{display:none}}

.hd-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who-in{font-size:.84rem;color:var(--mute)}
.linkbtn{background:none;border:none;padding:0;color:var(--cyan-dk);font-weight:600;font-size:.86rem;text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--ink)}
.err{color:var(--crimson);font-size:.88rem;margin:10px 0 0;min-height:1.2em}
.okmsg{color:#3F7A1E;font-size:.88rem;margin:10px 0 0}
@media(max-width:560px){ .hd{flex-direction:column} }

/* ---------- practice finder ---------- */
.step{font-size:.83rem;font-weight:700;color:var(--slate);margin:26px 0 9px;letter-spacing:.01em}
.step b{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
  background:var(--ink);color:#fff;font-size:.72rem;margin-right:7px;vertical-align:1px}
.grades{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.gbtn{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 4px 9px;text-align:center;color:var(--ink)}
.gbtn .n{display:block;font-size:1.45rem;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.gbtn .t{display:block;font-size:.74rem;color:var(--mute);font-weight:600}
.gbtn:hover{border-color:var(--cyan)}
.gbtn[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#fff}
.gbtn[aria-pressed="true"] .t{color:#fff;opacity:.85}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{background:none;border:none;border-radius:9px;padding:8px 18px;font-weight:600;color:var(--slate)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:hover:not([aria-pressed="true"]){background:var(--wash);color:var(--ink)}
.search{position:relative;margin-top:22px}
.search input{width:100%;padding:11px 12px 11px 38px;border-radius:12px;font-size:1rem}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mute)}
.course{margin:22px 0 0;color:var(--slate);font-size:.93rem}
.course b{color:var(--ink)}
.topics{display:flex;flex-direction:column;gap:10px;margin-top:12px}
details.topic{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.topic[open]{border-color:#BFE9F0;box-shadow:0 1px 3px rgba(31,41,51,.06)}
.topic summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px}
.topic summary::-webkit-details-marker{display:none}
.topic summary:hover{background:#FAFCFC}
.tt{flex:1;min-width:0;font-weight:600;font-size:1.03rem;line-height:1.3}
.tc{font-size:.8rem;color:var(--mute);white-space:nowrap}
.chev{flex:none;width:18px;height:18px;color:var(--mute);transition:transform .15s}
details[open] .chev{transform:rotate(90deg);color:var(--cyan-dk)}
.gtag{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--wash);color:var(--slate);white-space:nowrap;margin-left:6px;vertical-align:1px}
.tb{padding:0 16px 14px}
.ask{background:#F0FBFD;border-radius:9px;padding:10px 12px;font-size:.93rem;color:#0E5F6C;margin:0 0 10px}
.ask span{font-weight:700}
.extra{font-size:.86rem;color:var(--mute);margin:0 0 10px}
.les{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.les:first-of-type{border-top:none}
.les-n{flex:1;min-width:0;font-size:.97rem}
.les-n small{display:block;color:var(--mute);font-size:.78rem}
.les .btn{padding:7px 14px;font-size:.88rem;white-space:nowrap}
.gap{background:var(--paper);border:1px dashed #D3DADF;border-radius:12px;padding:14px 16px;margin-top:22px}
.gap h3{margin:0 0 6px;font-size:.92rem}
.gap p{margin:0 0 8px;font-size:.88rem;color:var(--slate)}
.gap ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.gap li{font-size:.84rem;background:var(--wash);color:var(--slate);border-radius:20px;padding:3px 10px}
.empty{padding:16px;color:var(--mute);font-size:.94rem;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.pick{padding:26px 16px;text-align:center;color:var(--mute);background:var(--paper);border:1px dashed #D3DADF;border-radius:12px;margin-top:22px}
@media(max-width:560px){
  .grades{grid-template-columns:repeat(4,1fr)}
  .seg{display:flex}
  .seg button{flex:1;padding:8px 6px}
  .les{flex-wrap:wrap}
}
</style>
</head>

  {id:'resume', g:[10,11,12], t:'Résumés (life skills)', ask:'Are you applying for a job or scholarship?', l:['w10-01','w10-02','w10-03','w10-04','w10-05','w10-06','w10-07','w10-08','w10-09'], k:'job application resume', x:'Written for adults; great for older students applying for jobs.'},
  {id:'email', g:[9,10,11,12], t:'Professional email & texting (life skills)', ask:'Do you need to email a teacher or an employer?', l:['w14-01','w14-02','w14-03'], k:'email text message'}

const ELA_GAPS=['Reading comprehension','Main idea & theme','Literature analysis','Vocabulary strategies','Story (narrative) writing','Giving presentations'];

/* ---------- helpers ---------- */
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ord=n=>n+'th';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let state={grade:+store.get('pf_grade')||null, subj:store.get('pf_subj')||'math', q:''};

/* ---------- modal + sign-in (same pattern as the library page) ---------- */
function openModal(html,onReady){
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="veil"><div class="modal f" role="dialog" aria-modal="true">${html}</div></div>`;
  root.querySelector('.veil').onclick=e=>{if(e.target===e.currentTarget)closeModal()};
  document.addEventListener('keydown',escClose);
  onReady&&onReady(root);
  const f=root.querySelector('input'); f&&f.focus();
}
const closeModal=()=>{document.getElementById('modalRoot').innerHTML='';document.removeEventListener('keydown',escClose)};
function escClose(e){if(e.key==='Escape')closeModal()}
function signInModal(){
  openModal(`
    <h3>Sign in</h3><p class="when">Use the email and password for your Succeed in School instructor account.</p>
    <div><label for="a_em">Email</label><input type="email" id="a_em" autocomplete="username"></div>
    <div style="margin-top:12px"><label for="a_pw">Password</label><input type="password" id="a_pw" autocomplete="current-password"></div>
    <p class="err" id="a_err" role="alert"></p>
    <div class="acts" style="margin-top:6px"><button class="btn" id="a_go">Sign in</button>
      <button class="btn q" id="a_cancel">Cancel</button>
      <button class="linkbtn" id="a_reset" style="margin-left:auto">Forgot password?</button></div>`,root=>{
    const em=root.querySelector('#a_em'), pw=root.querySelector('#a_pw'), err=root.querySelector('#a_err');
    root.querySelector('#a_cancel').onclick=closeModal;
    const go=root.querySelector('#a_go');
    const tryLogin=async()=>{
      err.className='err'; err.textContent='';
      if(!em.value.trim()||!pw.value){err.textContent='Enter your email and password.';return;}
      go.disabled=true; go.textContent='Signing in…';
      try{ await auth.signInWithEmailAndPassword(em.value.trim(),pw.value); closeModal(); }
      catch(e){
        const c=e&&e.code||'';
        err.textContent = c==='auth/too-many-requests' ? 'Too many attempts. Wait a few minutes, or reset your password.'
          : c==='auth/network-request-failed' ? 'No connection. Check your internet and try again.'
          : 'That email and password do not match an instructor account.';
        go.disabled=false; go.textContent='Sign in';
      }
    };
    go.onclick=tryLogin;
    pw.addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
    root.querySelector('#a_reset').onclick=async()=>{
      err.className='err'; err.textContent='';
      if(!em.value.trim()){err.textContent='Enter your email first, then choose Forgot password.';return;}
      try{ await auth.sendPasswordResetEmail(em.value.trim()); }catch(e){}
      err.className='okmsg';
      err.textContent='If that email has an instructor account, a reset link is on its way.';
    };
  });
}

/* ---------- finder ---------- */
const CHEV='<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>';
function topicHTML(tp,opts={}){
  const tag=opts.gradeTag ? `<span class="gtag">${esc(opts.gradeTag)}</span>` : '';
  const rows=tp.l.map(id=>`<div class="les"><div class="les-n">${esc(LESSONS[id])}<small>Pathway lesson ${esc(id)}</small></div>
      <a class="btn q" href="${esc(lessonUrl(id))}" target="_blank" rel="noopener" aria-label="Open ${esc(LESSONS[id])} (opens in a new tab)">Open ↗</a></div>`).join('');
  return `<details class="topic"${opts.open?' open':''}><summary><span class="tt">${esc(tp.t)}${tag}</span>
      <span class="tc">${tp.l.length} lesson${tp.l.length>1?'s':''}</span>${CHEV}</summary>
    <div class="tb"><p class="ask"><span>Ask:</span> “${esc(tp.ask)}”</p>${tp.x?`<p class="extra">${esc(tp.x)}</p>`:''}${rows}</div></details>`;
}
function gradeLabel(tp){
  if(!tp.g.length) return 'Review';
  if(tp.g.length===ALL.length) return 'All grades';
  const a=tp.g[0], b=tp.g[tp.g.length-1];
  return a===b ? `Grade ${a}` : `Grades ${a}–${b}`;
}
function gradesHTML(){
  return `<div class="step"><b>1</b>What grade is the student in?</div>
    <div class="grades" role="group" aria-label="Grade">${ALL.map(g=>`<button class="gbtn" data-g="${g}" aria-pressed="${state.grade===g}">
      <span class="n">${g}</span><span class="t">${ord(g)}</span></button>`).join('')}</div>
    <div class="step"><b>2</b>What do they need help with?</div>
    <div class="seg" role="group" aria-label="Subject">
      <button data-s="math" aria-pressed="${state.subj==='math'}">Math</button>
      <button data-s="ela" aria-pressed="${state.subj==='ela'}">Writing &amp; grammar</button></div>
    <div class="search"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
      <input type="search" id="q" placeholder="Or search any topic: fractions, slope, commas…" aria-label="Search topics" value="${esc(state.q)}"></div>
    <div id="results"></div>
    <p class="note">Lessons open on the free BYU-Pathway Resource Center. Each one has a short explanation, examples, and practice problems. To print, open the lesson and press <b>Ctrl+P</b> (<b>Cmd+P</b> on a Mac). Answers are on the same page, so check what you print before handing it to a student.</p>`;
}
function resultsHTML(){
  const q=state.q.trim().toLowerCase();
  if(q){
    const words=q.split(/\s+/);
    const hit=tp=>{const hay=(tp.t+' '+(tp.k||'')+' '+tp.l.map(id=>LESSONS[id]).join(' ')).toLowerCase(); return words.every(w=>hay.includes(w));};
    const found=[...MATH.filter(hit).map(tp=>({tp,s:'Math'})),...ELA.filter(hit).map(tp=>({tp,s:'Writing'}))];
    if(!found.length) return `<div class="topics"><div class="empty">No topics match “${esc(state.q)}”. Try a simpler word, like <i>fraction</i>, <i>equation</i>, or <i>comma</i>.</div></div>`;
    return `<p class="course">${found.length} topic${found.length>1?'s':''} match “${esc(state.q)}”</p><div class="topics">`
      + found.map(f=>topicHTML(f.tp,{gradeTag:(f.s==='Writing'?'Writing · ':'')+gradeLabel(f.tp),open:found.length===1})).join('')+'</div>';
  }
  const g=state.grade;
  if(!g) return `<div class="pick">Pick a grade to see the topics that grade usually covers.</div>`;
  if(state.subj==='ela'){
    const list=ELA.filter(tp=>tp.g.includes(g));
    return `<p class="course"><b>Writing &amp; grammar · ${ord(g)} grade.</b> These skills build every year, so the same lessons work for all grades.</p>
      <div class="topics">${list.map(tp=>topicHTML(tp)).join('')}</div>
      <div class="gap"><h3>Not on Pathway</h3><p>For these, use the student’s class materials or another resource.</p>
      <ul>${ELA_GAPS.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  }
  const info=GRADE_INFO[g];
  const list=MATH.filter(tp=>tp.g.includes(g));
  const rev=(REVIEW[g]||[]).map(id=>MATH.find(t=>t.id===id)).filter(Boolean);
  let html=`<p class="course"><b>Math · ${ord(g)} grade</b> (${esc(info.course)}).`
    + (info.thin ? ` Pathway only covers a few ${ord(g)} grade topics, but students at this level often need a quick review of the basics below.` : ` Topics this grade usually covers:`) + `</p>`;
  if(list.length) html+=`<div class="topics">${list.map(tp=>topicHTML(tp)).join('')}</div>`;
  if(rev.length) html+=`<h2>${info.thin?'Good review for this grade':'Review from earlier grades'}</h2><div class="topics">${rev.map(tp=>topicHTML(tp)).join('')}</div>`;
  html+=`<div class="gap"><h3>Not on Pathway for ${ord(g)} grade</h3><p>For these, use the student’s class materials or another resource.</p>
    <ul>${(MATH_GAPS[g]||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  return html;
}
function drawResults(){ document.getElementById('results').innerHTML=resultsHTML(); }
function drawFinder(){
  showApp(gradesHTML()); drawResults();
  const app=document.getElementById('app');
  app.querySelectorAll('.gbtn').forEach(b=>b.onclick=()=>{
    state.grade=+b.dataset.g; state.q=''; store.set('pf_grade',state.grade);
    app.querySelectorAll('.gbtn').forEach(x=>x.setAttribute('aria-pressed',x===b));
    document.getElementById('q').value=''; drawResults();
  });
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    state.subj=b.dataset.s; state.q=''; store.set('pf_subj',state.subj);
    app.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    document.getElementById('q').value=''; drawResults();
  });
  document.getElementById('q').oninput=e=>{state.q=e.target.value; drawResults();};
}

/* ---------- page ---------- */
function showApp(html){
  document.getElementById('loading').hidden=true;
  const app=document.getElementById('app'); app.hidden=false; app.innerHTML=html;
}
let user=null, isInstructor=false;
async function checkInstructor(u){
  if(!u) return false;
  try{ const d=await db.collection('admins').doc(u.uid).get(); return d.exists; }catch(e){ return false; }
}
function chrome(){
  const wi=document.getElementById('whoIn');
  wi.hidden=!user; wi.textContent=user?`Signed in as ${user.email}`:'';
  document.getElementById('signInBtn').hidden=!!user;
  document.getElementById('signOutBtn').hidden=!user;
}
function render(){
  chrome();
  if(!user){
    showApp(`<div class="panel" style="margin-top:26px;text-align:center;color:var(--slate)">
      <p style="margin:0 0 14px">The practice finder is for Succeed in School instructors. Sign in to use it.</p>
      <button class="btn" id="signInMain">Sign in</button></div>`);
    document.getElementById('signInMain').onclick=signInModal; return;
  }
  if(!isInstructor){
    showApp(`<div class="panel" style="margin-top:26px;text-align:center;color:var(--slate)">
      <p style="margin:0">${esc(user.email)} does not have instructor access. Ask Eric to add this account.</p></div>`);
    return;
  }
  drawFinder();
}

document.getElementById('signInBtn').onclick=signInModal;
document.getElementById('signOutBtn').onclick=()=>auth.signOut();
if(auth) auth.onAuthStateChanged(async u=>{ user=u; isInstructor=await checkInstructor(u); render(); });
else document.getElementById('loading').textContent='The practice finder could not load. Refresh the page to try again.';
</script>
